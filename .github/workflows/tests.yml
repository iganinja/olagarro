# Tests every push to master, and a run started by hand from the Actions tab: in the terminal build and in the one with
# the window module, on x86-64 and ARM64 Linux and on Apple's and Intel's Macs. Olagarro is a library and makes no
# releases: the programs made with it publish their own, as OUI Code at https://github.com/iganinja/oui_code and OUI
# Paint at https://github.com/iganinja/oui_paint.
name: Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every system's tests to the end, though one fails: each shows its failures.
      fail-fast: false
      matrix:
        include:
          - name: x86_64 terminal
            runner: ubuntu-24.04
            options: ""
          - name: x86_64 gui
            runner: ubuntu-24.04
            options: --gui
          - name: aarch64 terminal
            runner: ubuntu-24.04-arm
            options: ""
          - name: aarch64 gui
            runner: ubuntu-24.04-arm
            options: --gui
          - name: macOS arm64 terminal
            runner: macos-15
            options: ""
          - name: macOS arm64 gui
            runner: macos-15
            options: -DOLAGARRO_OUI_WINDOW=ON
          - name: macOS x86_64 terminal
            runner: macos-15-intel
            options: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install what the build needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y cmake ninja-build g++ libgtest-dev libgmock-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols libegl-dev libgl-dev libdrm-dev \
            libgbm-dev
      - name: Build and test
        if: runner.os == 'Linux'
        run: tools/build.sh ${{ matrix.options }}
      - name: Install what the build needs on a Mac
        if: runner.os == 'macOS'
        run: brew install ninja googletest
      # Past every error to show them all, then the tests four at a time: a Mac has fewer cores, and is slower.
      - name: Build and test on a Mac
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.options }}
          cmake --build build -- -k 0
          ctest --test-dir build --output-on-failure -j4 --timeout 300
