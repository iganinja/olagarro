# Makes a release from a version's tag, as v0.4.0: the tests, in the terminal build and in the one with the window
# module, on x86-64 and ARM64 Linux and on Apple's and Intel's Macs, then the tag's release, its notes made from the
# changes since the last one. Olagarro is a library, so the release is its source; the programs made with it publish
# their own, as OUI Code's at https://github.com/iganinja/oui_code. Started by hand from the Actions tab, it runs the
# tests only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every system's tests to the end, though one fails: each shows its failures, and nothing is built either way.
      fail-fast: false
      matrix:
        include:
          - name: x86_64 terminal
            runner: ubuntu-24.04
            options: ""
          - name: x86_64 gui
            runner: ubuntu-24.04
            options: --gui
          - name: aarch64 terminal
            runner: ubuntu-24.04-arm
            options: ""
          - name: aarch64 gui
            runner: ubuntu-24.04-arm
            options: --gui
          - name: macOS arm64 terminal
            runner: macos-15
            options: ""
          - name: macOS arm64 gui
            runner: macos-15
            options: -DOLAGARRO_OUI_WINDOW=ON
          - name: macOS x86_64 terminal
            runner: macos-15-intel
            options: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install what the build needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y cmake ninja-build g++ libgtest-dev libgmock-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols libegl-dev libgl-dev libdrm-dev \
            libgbm-dev
      - name: Build and test
        if: runner.os == 'Linux'
        run: tools/build.sh ${{ matrix.options }}
      - name: Install what the build needs on a Mac
        if: runner.os == 'macOS'
        run: brew install ninja googletest
      # Past every error to show them all, then the tests four at a time: a Mac has fewer cores, and is slower.
      - name: Build and test on a Mac
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.options }}
          cmake --build build -- -k 0
          ctest --test-dir build --output-on-failure -j4 --timeout 300

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Publish the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
