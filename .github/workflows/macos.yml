# Builds and tests olagarro on macOS, on Apple's processors and on Intel's, to see what it lacks there. It runs on
# every push to the branch macos, where olagarro is made to build on a Mac, and keeps building past an error so each
# run shows them all.
name: macOS

on:
  push:
    branches: [macos]
  workflow_dispatch:

jobs:
  build:
    name: macOS ${{ matrix.machine }} (${{ matrix.kind }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: arm64
            runner: macos-15
            kind: terminal
            options: ""
          - machine: arm64
            runner: macos-15
            kind: gui
            options: -DOLAGARRO_OUI_WINDOW=ON
          - machine: x86_64
            runner: macos-15-intel
            kind: terminal
            options: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install what the build needs
        run: brew install ninja googletest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.options }}
      - name: Build, past every error
        run: cmake --build build -- -k 0
      # What the end-to-end tests do, step by step and told: a terminal by script(1) reading its keys from a named pipe.
      - name: How script(1) takes keys from a pipe here
        continue-on-error: true
        run: |
          perl -e 'alarm 20; exec @ARGV' sh -c '
            rm -f /tmp/keys; mkfifo /tmp/keys
            (sleep 15 > /tmp/keys & exec 3< /tmp/keys
             echo "pipe open to read"
             script -q /dev/null /bin/sh -c "stty cols 40 rows 10; stty size; echo inside; read key; echo got \$key; sleep 1" <&3
             echo "script ended with $?") &
            sleep 2
            echo "writing a key"
            printf "x\n" > /tmp/keys
            echo "key written"
            wait
            echo "all ended"'
      # Four at a time, and none longer than five minutes: one that hangs says so without holding the rest.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4 --timeout 300
