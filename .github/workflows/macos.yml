# Builds and tests olagarro on macOS, on Apple's processors and on Intel's: with each version's tag, beside the release,
# so each version is known to build and pass its tests on a Mac too, and when started by hand from the Actions tab. It
# keeps building past an error, so a run shows them all.
name: macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: macOS ${{ matrix.machine }} (${{ matrix.kind }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: arm64
            runner: macos-15
            kind: terminal
            options: ""
          - machine: arm64
            runner: macos-15
            kind: gui
            options: -DOLAGARRO_OUI_WINDOW=ON
          - machine: x86_64
            runner: macos-15-intel
            kind: terminal
            options: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install what the build needs
        run: brew install ninja googletest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.options }}
      - name: Build, past every error
        run: cmake --build build -- -k 0
      # Four at a time, and none longer than five minutes: one that hangs says so without holding the rest.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4 --timeout 300
